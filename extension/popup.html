<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #eef1f8;
    --card: #ffffff;
    --border: #e2e6f0;
    --text: #1c2434;
    --muted: #6b7590;
    --accent: #3b6ef0;
    --accent-soft: #e6edfd;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 264px;
    padding: 12px;
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(28, 36, 52, 0.05);
  }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .title { font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { display: none; }
  .knob {
    position: absolute; inset: 0;
    background: var(--border); border-radius: 999px;
    transition: background .15s;
  }
  .knob::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .15s;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .switch input:checked + .knob { background: var(--accent); }
  .switch input:checked + .knob::after { transform: translateX(16px); }

  .radio { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; }
  .radio input { accent-color: var(--accent); }

  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 5px; margin-top: 8px;
  }
  .grid label {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 3px 6px;
    border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; white-space: nowrap; overflow: hidden;
  }
  .grid label:has(input:checked) {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .grid input { accent-color: var(--accent); width: 11px; height: 11px; }

  textarea {
    width: 100%; margin-top: 8px; padding: 6px 8px;
    font: inherit; font-size: 12px; color: var(--text);
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    outline: none; resize: vertical; min-height: 44px;
  }
  textarea:focus { border-color: var(--accent); }

  .mini-btn {
    font: inherit; font-size: 11px; cursor: pointer;
    color: var(--accent); background: var(--accent-soft);
    border: none; border-radius: 6px; padding: 4px 8px;
  }
  .mini-btn:hover { filter: brightness(.95); }

  .media-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; border-top: 1px solid var(--border);
  }
  .media-item:first-child { border-top: none; }
  .media-item .name {
    flex: 1; min-width: 0; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .media-item .mime { color: var(--muted); font-size: 10px; }
  .media-item button {
    font: inherit; font-size: 11px; cursor: pointer; flex: none;
    color: #fff; background: var(--accent);
    border: none; border-radius: 6px; padding: 3px 8px;
  }
  .media-item button:hover { filter: brightness(.92); }
  .media-item button.sent { background: #16a34a; cursor: default; }

  input[type="text"], input[type="number"] {
    width: 100%; margin-top: 8px; padding: 6px 8px;
    font: inherit; font-size: 12px; color: var(--text);
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  input[type="number"] { width: 64px; margin-top: 0; padding: 4px 6px; }

  .dim { opacity: .45; pointer-events: none; }
  .disabled-section .grid, .disabled-section input[type="text"] { opacity: .45; pointer-events: none; }

  .foot { text-align: center; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <div class="card row">
    <div>
      <div class="title">Capture downloads</div>
      <div class="hint">Send browser downloads to the app</div>
    </div>
    <label class="switch"><input type="checkbox" id="enabled"><span class="knob"></span></label>
  </div>

  <div class="card" id="filter-card">
    <label class="radio"><input type="radio" name="mode" value="all"> All files</label>
    <label class="radio"><input type="radio" name="mode" value="list"> Only selected types</label>
    <div class="grid" id="ext-grid"></div>
    <input type="text" id="custom" placeholder="extra extensions, comma-separated">
  </div>

  <div class="card" id="media-card" style="display:none">
    <div class="title">Media on this page</div>
    <div class="hint">Seen by this tab — click to download</div>
    <div id="media-list"></div>
  </div>

  <div class="card row" id="size-card">
    <span>Skip files under</span>
    <span><input type="number" id="minSize" min="0" step="0.5"> MB</span>
  </div>

  <div class="card" id="excl-card">
    <div class="row">
      <div class="title">Never capture from</div>
      <button class="mini-btn" id="exclude-site">+ this site</button>
    </div>
    <textarea id="exclusions" placeholder="one domain per line, e.g. youtube.com"></textarea>
  </div>

  <div class="foot">Open Downloader</div>
  <script src="popup.js"></script>
</body>
</html>
