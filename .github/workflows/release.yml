name: CI & Cross-Platform Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Test & Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  release:
    name: Package (${{ matrix.target }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p od-cli -p od-nmh
      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="open-downloader-${TAG}-${{ matrix.target }}"
          mkdir -p "${STAGE}/deploy" "${STAGE}/scripts"
          cp "target/${{ matrix.target }}/release/od" "${STAGE}/"
          cp "target/${{ matrix.target }}/release/od-nmh" "${STAGE}/"
          cp -r deploy/* "${STAGE}/deploy/"
          cp scripts/install.sh scripts/uninstall.sh "${STAGE}/scripts/"
          cp README.md LICENSE "${STAGE}/"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = "open-downloader-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "$stage\deploy", "$stage\scripts" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\od.exe" "$stage\"
          Copy-Item "target\${{ matrix.target }}\release\od-nmh.exe" "$stage\"
          Copy-Item -Recurse "deploy\*" "$stage\deploy\"
          Copy-Item "scripts\install.ps1", "scripts\uninstall.ps1", "scripts\install-host.ps1" "$stage\scripts\"
          Copy-Item "README.md", "LICENSE" "$stage\"
          Compress-Archive -Path "$stage" -DestinationPath "$stage.zip" -Force
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Set-Content "$stage.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            open-downloader-*.tar.gz*
            open-downloader-*.zip*
